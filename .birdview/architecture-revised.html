[data-theme="light"] .simulation{color:#89631e;border-color:#a87a27}

[data-theme="light"] .node.completed{background:#e9f3ed;border-color:#3c8461;box-shadow:none}
[data-theme="light"] .edge{stroke:#7a8e81}
[data-theme="light"] .edge.relevant{stroke:#8b7444;opacity:.8}
[data-theme="light"] .legend .planned{border-color:#937944}
[data-theme="light"] p{color:#4d6356}
[data-theme="light"] li,[data-theme="light"] code{color:#355341}
[data-theme="light"] .unmapped,[data-theme="light"] #checks{color:#89631e}
[data-theme="light"] .step{border-color:#d8dfdb}
[data-theme="light"] .step.current{border-color:var(--mint)}
[data-theme="light"] .step.past{border-color:#8eaf9c}
